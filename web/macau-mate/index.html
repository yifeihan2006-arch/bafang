<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#123f3b" />
    <meta
      name="description"
      content="Plan your visit to Macao and discover its living cultural heritage."
    />
    <title>MACAU MATE · Your Macao, Your Way.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <style>
:root {
  --ink: #232a29;
  --green: #123f3b;
  --green2: #245950;
  --gold: #c4a46a;
  --ivory: #f8f5ee;
  --pale: #e8efeb;
  --line: #e4ded1;
  --muted: #5c6961;
  --paper: #fffdf8;
  --serif: 'Instrument Serif', Georgia, 'Songti SC', 'Noto Serif CJK SC', serif;
  --sans: 'DM Sans', system-ui, sans-serif;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  color: var(--ink);
  background: var(--ivory);
  font: 15px/1.55 var(--sans);
}
button,
input,
select,
textarea {
  font: inherit;
}
button,
a,
select {
  touch-action: manipulation;
}
button {
  cursor: pointer;
}
a {
  color: var(--green);
}
:focus-visible {
  outline: 3px solid #b99556;
  outline-offset: 3px;
}
button:disabled {
  opacity: 0.48;
  cursor: not-allowed;
}
img {
  max-width: 100%;
  display: block;
}
h1,
h2,
h3,
p {
  margin: 0;
}
h1,
h2,
h3 {
  line-height: 1.08;
}
h1,
h2 {
  font-family: var(--serif);
  font-weight: 400;
}
h3 {
  font-weight: 650;
}
h1 {
  font-size: clamp(3rem, 7vw, 6.2rem);
  letter-spacing: -0.04em;
}
h2 {
  font-size: clamp(2.25rem, 4.2vw, 3.65rem);
  letter-spacing: -0.025em;
}
small,
.muted {
  color: var(--muted);
}
.wrap {
  width: min(1220px, calc(100% - 86px));
  margin-inline: auto;
}
.textlink {
  font-weight: 700;
  text-decoration: none;
}
.textlink:hover {
  text-decoration: underline;
}
.eyebrow {
  text-transform: uppercase;
  letter-spacing: 0.16em;
  font-weight: 700;
  font-size: 0.69rem;
  color: #795d34;
}
.sitehead {
  height: 78px;
  background: var(--ivory);
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  z-index: 10;
}
.headinner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 22px;
  height: 100%;
}
.brand {
  border: 0;
  background: none;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  color: var(--green);
  font-weight: 700;
  font-size: 1.04rem;
  letter-spacing: 0.08em;
  white-space: nowrap;
  padding: 0;
}
.brand-logo {
  display: block;
  width: 60px;
  height: 60px;
  flex: 0 0 60px;
  object-fit: contain;
  border-radius: 9px;
}
.brand-name {
  display: block;
}
.nav {
  display: flex;
  align-items: center;
  gap: clamp(10px, 3vw, 33px);
}
.nav button {
  border: 0;
  background: transparent;
  padding: 8px 0;
  color: var(--muted);
  white-space: nowrap;
  font-weight: 600;
  font-size: 0.88rem;
}
.nav button[aria-current='page'] {
  color: var(--green);
  border-bottom: 2px solid var(--gold);
}
.headright {
  display: flex;
  gap: 12px;
  align-items: center;
}
.lang {
  width: auto;
  max-width: 115px;
  padding: 7px 5px;
  background: transparent;
  border: 0;
  color: var(--green);
  font-weight: 600;
  font-size: 0.82rem;
}
.chip,
.tag {
  border-radius: 30px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px solid var(--line);
  background: var(--paper);
  color: var(--green);
  font-weight: 650;
  font-size: 0.78rem;
  padding: 7px 12px;
}
.hero {
  margin-top: 22px;
  min-height: 576px;
  border-radius: 22px;
  position: relative;
  display: flex;
  align-items: center;
  overflow: hidden;
  background: #17332e;
  color: #fff9eb;
  isolation: isolate;
}
.hero:before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    linear-gradient(
      90deg,
      rgba(12, 39, 34, 0.94) 0%,
      rgba(13, 41, 36, 0.83) 29%,
      rgba(14, 40, 35, 0.48) 59%,
      rgba(20, 45, 37, 0.07) 100%
    );
  z-index: -1;
}
.hero-inner {
  padding: 50px 6.3%;
  width: min(100%, 800px);
}
.hero .eyebrow {
  color: #e9c98a;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.hero .eyebrow:before {
  content: '';
  width: 22px;
  height: 1px;
  background: #d4b17a;
}
.hero h1 {
  font-size: clamp(3.3rem, 7.3vw, 6.1rem);
}
.hero h1 em {
  color: #f1d4a2;
  font-weight: 400;
}
.hero p {
  font-size: 1rem;
  color: #f4eee0;
  max-width: 475px;
  margin-top: 18px;
}
.hero form {
  background: var(--paper);
  color: var(--green);
  max-width: 600px;
  border-radius: 13px;
  margin-top: 24px;
  padding: 15px 16px;
  box-shadow: 0 12px 35px #09201d43;
}
.hero label {
  font-weight: 700;
  font-size: 0.78rem;
  display: block;
}
.hero textarea {
  resize: vertical;
  min-height: 60px;
  margin: 5px 0 8px;
  width: 100%;
  border: 0;
  background: transparent;
  padding: 0;
  color: var(--ink);
  font-size: 0.91rem;
}
.hero textarea::placeholder {
  color: #68756f;
}
.hero-actions {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  border-top: 1px solid var(--line);
  padding-top: 12px;
}
.button,
.plain,
.icon-btn {
  border: 1px solid transparent;
  border-radius: 8px;
  padding: 10px 16px;
  background: var(--green);
  color: white;
  font-weight: 700;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  line-height: 1.3;
  text-align: center;
}
.button:hover {
  background: var(--green2);
}
.button.gold {
  background: var(--gold);
  color: #182d27;
}
.button.gold:hover {
  background: #d7b779;
}
.button.secondary {
  background: var(--paper);
  color: var(--green);
  border-color: var(--line);
}
.button.secondary:hover,
.plain:hover,
.icon-btn:hover {
  background: var(--pale);
}
.plain,
.icon-btn {
  background: transparent;
  color: var(--green);
  padding: 6px 8px;
}
.icon-btn {
  width: 34px;
  height: 34px;
  padding: 0;
  border-color: var(--line);
}
.smallbtn {
  font-size: 0.78rem;
  padding: 6px 9px;
}
.link-btn {
  border: 0;
  background: none;
  color: var(--green);
  text-decoration: underline;
  text-underline-offset: 3px;
  font: inherit;
  cursor: pointer;
  padding: 0;
}
.quick {
  padding: 26px 0;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 9px;
}
.quick strong {
  font-size: 0.85rem;
  margin-right: 7px;
}
.chip:hover,
.chip[aria-pressed='true'] {
  background: var(--green);
  color: white;
  border-color: var(--green);
}
.chip span {
  font-size: 1.05em;
}
.section {
  padding: 48px 0 60px;
}
.section-head {
  display: flex;
  justify-content: space-between;
  gap: 18px;
  align-items: end;
  margin-bottom: 23px;
}
.section-head .eyebrow {
  margin-bottom: 8px;
}
.section-head p,
.page-title p {
  margin-top: 8px;
  color: var(--muted);
}
.cards {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 18px;
}
.place-card {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 15px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.place-card .thumb {
  height: 180px;
}
.thumb {
  position: relative;
  background: linear-gradient(130deg, #246457, #123f3b);
  overflow: hidden;
  display: grid;
  place-items: center;
  color: #f1d4a2;
  font: 4rem var(--serif);
}
.thumb img {
  height: 100%;
  width: 100%;
  object-fit: cover;
}
.thumb img[hidden],
.hero img[hidden] {
  display: none;
}
.place-card .pad {
  padding: 17px;
}
.place-card h3 {
  font-family: var(--serif);
  font-size: 1.62rem;
  font-weight: 400;
  margin: 9px 0;
}
.place-card .textlink {
  border: 0;
  background: transparent;
  color: var(--green);
  padding: 0;
}
.sitefoot {
  padding: 27px 0;
  color: var(--muted);
  border-top: 1px solid var(--line);
  font-size: 0.81rem;
}
.sitefoot .wrap {
  display: flex;
  gap: 8px 25px;
  justify-content: space-between;
  flex-wrap: wrap;
}
.innerpage {
  padding: 30px 0 65px;
  min-height: 70vh;
}
.page-title {
  margin-bottom: 24px;
}
.page-title .eyebrow {
  margin-bottom: 8px;
}
.sheet,
.panel,
.option,
.summary-card {
  border-radius: 15px;
  border: 1px solid var(--line);
  background: var(--paper);
  padding: 22px;
}
.sheet {
  max-width: 900px;
  margin: auto;
  padding: clamp(18px, 4vw, 34px);
}
.sheet form {
  margin-top: 20px;
}
.fieldgrid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 15px;
}
.field {
  display: grid;
  gap: 6px;
  font-weight: 650;
  font-size: 0.85rem;
  min-width: 0;
}
.field:has(input[type='checkbox']) {
  display: flex;
  align-items: center;
}
.field input:not([type='checkbox']),
.field select,
.field textarea,
.searchbox,
input.searchbox {
  display: block;
  width: 100%;
  min-width: 0;
  max-width: 100%;
  border: 1px solid #cfcabe;
  background: #fffefb;
  padding: 9px;
  border-radius: 7px;
  color: var(--ink);
  font-weight: 500;
}
.field textarea {
  min-height: 76px;
  resize: vertical;
}
.wide {
  grid-column: 1/-1;
}
.field.block {
  margin-top: 12px;
}
.sheet details,
.panel details {
  margin: 15px 0;
  padding: 10px 0;
  border-top: 1px solid var(--line);
}
summary {
  font-weight: 700;
  color: var(--green);
  cursor: pointer;
  margin-bottom: 7px;
}
details[open] summary {
  margin-bottom: 14px;
}
.actions {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}
.actions.end {
  justify-content: flex-end;
  margin-top: 20px;
}
.field-note,
.notice {
  margin: 12px 0;
  padding: 11px 13px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #f6f2e8;
  color: #4f4d42;
  font-size: 0.85rem;
}
.notice.error {
  border-color: #d6ab93;
  background: #faede5;
  color: #6c3422;
}
.notice.good {
  background: var(--pale);
  border-color: #cfded4;
  color: var(--green);
}
.option {
  display: flex;
  flex-direction: column;
  gap: 13px;
  padding: 21px;
}
.option:nth-child(2) {
  border-color: #c3a36a;
}
.option h3 {
  font-family: var(--serif);
  font-size: 2rem;
  font-weight: 400;
  color: var(--green);
}
.option .button {
  align-self: stretch;
  margin-top: auto;
}
.option ul {
  padding-left: 18px;
  margin: 0;
}
.split {
  display: grid;
  grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
  gap: 18px;
  align-items: start;
}
.journey-head {
  display: flex;
  justify-content: space-between;
  align-items: end;
  gap: 12px;
  margin-bottom: 16px;
}
.journey-head .page-title {
  margin: 0;
}
.journey-head h2 {
  margin-bottom: 4px;
}
.journey-tools {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-bottom: 18px;
}
.metrics {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 11px;
  margin-bottom: 18px;
}
.summary-card {
  padding: 13px 14px;
  overflow-wrap: anywhere;
}
.summary-card strong {
  display: block;
  color: var(--green);
  font-size: 1.16rem;
  margin-top: 3px;
}
.summary-card small {
  line-height: 1.2;
}
.panel h3 {
  color: var(--green);
  margin-bottom: 11px;
}
.rightstack {
  display: grid;
  gap: 15px;
}
.tabs {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
  margin-bottom: 13px;
}
.tab {
  font-weight: 700;
  border: 1px solid var(--line);
  color: var(--green);
  background: var(--paper);
  border-radius: 7px;
  padding: 7px 11px;
}
.tab[aria-selected='true'] {
  background: var(--green);
  color: white;
  border-color: var(--green);
}
.timeline-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.timeline {
  list-style: none;
  margin: 9px 0 0;
  padding: 0;
}
.eventrow {
  position: relative;
  border-left: 2px solid var(--line);
  padding: 0 0 13px 15px;
  margin-left: 8px;
}
.eventrow::before {
  content: '';
  position: absolute;
  left: -6px;
  top: 18px;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--gold);
  border: 2px solid var(--paper);
}
.eventrow.done::before {
  background: #5f9b7c;
}
.eventrow:last-child {
  padding-bottom: 0;
}
.eventcard {
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: #fffefb;
}
.eventcard.selected {
  border-color: #a2814a;
  background: #f9f5e9;
}
.eventmain {
  display: flex;
  gap: 9px;
  justify-content: space-between;
  align-items: start;
}
.eventtitle {
  font-size: 0.98rem;
  font-weight: 700;
  background: none;
  border: 0;
  padding: 0;
  text-align: left;
  color: var(--green);
}
.eventmeta {
  display: flex;
  align-items: center;
  gap: 7px;
  flex-wrap: wrap;
  color: var(--muted);
  font-size: 0.8rem;
  margin-top: 4px;
}
.eventcard .actions {
  margin-top: 8px;
}
.timechip {
  font-variant-numeric: tabular-nums;
  color: #705632;
  font-weight: 700;
  white-space: nowrap;
  font-size: 0.84rem;
}
.bookrow {
  display: grid;
  gap: 6px;
  border-bottom: 1px solid var(--line);
  padding: 12px 0;
}
.bookrow:last-child {
  border-bottom: 0;
}
.bookrow h3 {
  margin: 0;
}
.budget-row {
  display: grid;
  grid-template-columns: 1.45fr 1fr 1fr;
  gap: 6px;
  align-items: center;
  border-bottom: 1px solid var(--line);
  padding: 7px 0;
  font-size: 0.84rem;
}
.budget-row > *:not(:first-child) {
  text-align: right;
}
.budget-bar {
  height: 8px;
  background: var(--pale);
  border-radius: 8px;
  margin: 11px 0;
  overflow: hidden;
}
.budget-bar i {
  height: 100%;
  background: var(--green);
  display: block;
}
.budget-bar i.over {
  background: #a24d2e;
}
.mapcanvas {
  height: 318px;
  background: #dce7dd;
  border: 1px solid #ccd6c9;
  border-radius: 10px;
  overflow: hidden;
  position: relative;
  isolation: isolate;
  touch-action: none;
}
.mapcanvas .tiles,
.mapcanvas canvas,
.mapcanvas .markers {
  position: absolute;
  inset: 0;
  pointer-events: none;
}
.mapcanvas .tiles img {
  position: absolute;
  width: 256px;
  height: 256px;
  max-width: none;
}
.mapcanvas .tiles img:not(.tile-ready) {
  visibility: hidden;
}
.map-base-status {
  position: absolute;
  z-index: 1;
  bottom: 20px;
  left: 9px;
  max-width: calc(100% - 18px);
  padding: 5px 8px;
  border-radius: 5px;
  background: var(--paper);
  color: var(--ink);
  font-size: 0.75rem;
  pointer-events: none;
}
.mapcanvas .credits {
  position: absolute;
  bottom: 0;
  right: 0;
  background: #fffe;
  font-size: 9px;
  padding: 1px 4px;
  color: var(--ink);
}
.mapcanvas .pin {
  position: absolute;
  pointer-events: auto;
  transform: translate(-50%, -50%);
  border: 2px solid white;
  border-radius: 50%;
  width: 29px;
  height: 29px;
  display: grid;
  place-items: center;
  color: white;
  background: var(--green);
  font-size: 0.72rem;
  font-weight: 700;
  box-shadow: 0 2px 6px #0005;
}
.mapcanvas .pin.active {
  background: #a1672d;
  z-index: 2;
}
.mapcanvas .controls {
  display: grid;
  gap: 4px;
  position: absolute;
  top: 9px;
  right: 9px;
}
.controls .icon-btn {
  background: var(--paper);
  border-color: #c6cdbf;
  font-size: 1.2rem;
}
.mapnote {
  margin-top: 10px;
}
.routelist {
  padding: 0;
  list-style: none;
  margin: 12px 0;
  display: grid;
  gap: 5px;
}
.routelist li {
  font-size: 0.77rem;
  border-top: 1px solid var(--line);
  padding: 6px 0;
  display: flex;
  gap: 5px;
  align-items: start;
  justify-content: space-between;
}
.photo-cap {
  font-size: 0.7rem;
  color: var(--muted);
  margin: 6px 0;
}
.heritage-layout {
  display: grid;
  grid-template-columns: minmax(0, 1.36fr) minmax(0, 1fr);
  gap: 18px;
  align-items: start;
}
.heritage-layout .thumb {
  height: 265px;
  border-radius: 10px;
}
.guide-copy {
  font-size: 1.05rem;
  color: var(--ink);
  line-height: 1.68;
  min-height: 95px;
}
.quiz-question {
  margin: 18px 0 14px;
  font-weight: 700;
  color: var(--green);
  line-height: 1.65;
  overflow-wrap: anywhere;
}
.quiz-options {
  display: grid;
  gap: 8px;
  padding: 12px;
  border: 1px solid #d4dfd8;
  border-radius: 12px;
  background: var(--pale);
  min-width: 0;
}
.quiz-option {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  min-height: 46px;
  padding: 10px 12px;
  border: 1px solid transparent;
  border-radius: 8px;
  cursor: pointer;
  line-height: 1.5;
}
.quiz-option input[type='radio'] {
  flex: 0 0 18px;
  width: 18px;
  height: 18px;
  margin: 4px 0 0;
  accent-color: var(--green);
}
.quiz-option span { min-width: 0; overflow-wrap: anywhere; }
.quiz-option:has(input:checked) {
  background: #fffdf7;
  border-color: #a5b8ab;
}
.quiz-option:focus-within { outline: 2px solid var(--green); outline-offset: 2px; }
.quiz-actions { margin-top: 18px; align-items: center; }
.quiz-actions small { color: var(--muted, #636d67); flex: 1 1 160px; }
.quiz-status { margin: 16px 0 0; line-height: 1.6; }
.quiz-status.completed { color: var(--green); font-weight: 700; }
.quiz-status.completed small { display: block; font-weight: 400; color: var(--muted, #636d67); }
.quiz-status.error { color: #9b4039; }
.stampgrid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 13px;
}
.stamp {
  display: flex;
  flex-direction: column;
  min-width: 0;
  text-align: left;
  border: 1px dashed #b8b3a5;
  border-radius: 13px;
  overflow: hidden;
  color: var(--green);
  background: var(--paper);
  padding: 0;
}
.stamp-photo {
  width: 100%;
  aspect-ratio: 16 / 10;
}
.stamp-info {
  display: grid;
  gap: 4px;
  padding: 11px 13px 13px;
}
.stamp.earned {

  guide(
    "paul",
    [
      "The surviving fa\xE7ade belonged to the Church of the Mother of God, built between 1602 and 1640 beside St. Paul\u2019s College. A fire in 1835 destroyed most of the complex. The fa\xE7ade and steps anchor a cluster of sites that reflects the city\u2019s long cultural encounter.",
      "\u8FD9\u9762\u7ACB\u9762\u539F\u5C5E 1602 \u81F3 1640 \u5E74\u95F4\u5174\u5EFA\u7684\u5723\u6BCD\u6559\u5802\uFF0C\u65C1\u8FB9\u662F\u5723\u4FDD\u7984\u5B66\u9662\u30021835 \u5E74\u7684\u5927\u706B\u70E7\u6BC1\u4E86\u5EFA\u7B51\u7684\u5927\u90E8\u5206\u3002\u6CBF\u7740\u53F0\u9636\u89C2\u5BDF\u7ACB\u9762\uFF0C\u518D\u770B\u9644\u8FD1\u7684\u54EA\u5412\u5E99\uFF0C\u53EF\u4EE5\u7406\u89E3\u4E0D\u540C\u4FE1\u4EF0\u5982\u4F55\u5728\u6FB3\u95E8\u76F8\u90BB\u800C\u7ACB\u3002",
      "A fachada pertenceu \xE0 Igreja da Madre de Deus, constru\xEDda entre 1602 e 1640 junto do Col\xE9gio de S\xE3o Paulo. Um inc\xEAndio destruiu grande parte do conjunto em 1835. A fachada e a escadaria integram um n\xFAcleo que testemunha o encontro de culturas em Macau."
    ],
    [
      "Look for the fa\xE7ade\u2019s stacked tiers, niches and carved figures. Christian iconography appears alongside details shaped by the region\u2019s visual traditions. From the forecourt, trace where the doorway would have led before the fire.",
      "\u89C2\u5BDF\u7ACB\u9762\u9010\u5C42\u6392\u5217\u7684\u58C1\u9F9B\u548C\u96D5\u523B\u3002\u57FA\u7763\u6559\u56FE\u50CF\u4E0E\u53D7\u5730\u533A\u89C6\u89C9\u4F20\u7EDF\u5F71\u54CD\u7684\u7EC6\u8282\u540C\u65F6\u51FA\u73B0\u3002\u7AD9\u5728\u524D\u5730\uFF0C\u60F3\u8C61\u5927\u95E8\u5728\u706B\u707E\u524D\u901A\u5F80\u54EA\u91CC\u3002",
      "Observe os andares sobrepostos, os nichos e as figuras esculpidas. A iconografia crist\xE3 convive com pormenores ligados \xE0s tradi\xE7\xF5es visuais da regi\xE3o. Do adro, imagine a nave que se abria para l\xE1 da porta."
    ],
    [
      "Imagine this wall as the front of a much bigger building. Can you point to its old doorway? Look up for the figures placed above it.",
      "\u60F3\u8C61\u8FD9\u9762\u5899\u539F\u672C\u662F\u4E00\u5EA7\u5927\u6559\u5802\u7684\u6B63\u9762\u3002\u4F60\u80FD\u627E\u5230\u539F\u6765\u7684\u5927\u95E8\u5417\uFF1F\u62AC\u5934\u6570\u4E00\u6570\u95E8\u4E0A\u65B9\u7684\u96D5\u50CF\u3002",
      "Imagine esta parede como a frente de um edif\xEDcio muito maior. Consegue apontar a antiga porta? Procure as figuras que est\xE3o por cima."
    ],
    [
      "Walk around the side to Na Tcha Temple. The temple and the church remains make it possible to compare two different places of worship within the same neighbourhood.",
      "\u7ED5\u5230\u65C1\u8FB9\u7684\u54EA\u5412\u5E99\uFF0C\u5728\u540C\u4E00\u8857\u533A\u6BD4\u8F83\u4E24\u79CD\u4E0D\u540C\u7684\u5B97\u6559\u5EFA\u7B51\uFF0C\u4E0E\u6FB3\u95E8\u5386\u53F2\u57CE\u533A\u7684\u4FE1\u4EF0\u591A\u6837\u6027\u5EFA\u7ACB\u8054\u7CFB\u3002",
      "Passe pelo lado da fachada at\xE9 ao Templo de Na Tcha. No mesmo bairro, pode comparar dois lugares de culto com tradi\xE7\xF5es diferentes."
    ],
    [
      "Which architectural element survived the 1835 fire and still frames the top of the stairway?",
      "1835 \u5E74\u5927\u706B\u540E\uFF0C\u54EA\u4E00\u90E8\u5206\u4ECD\u7ACB\u5728\u5927\u53F0\u9636\u9876\u7AEF\uFF1F",
      "Que elemento sobreviveu ao inc\xEAndio de 1835 e ainda se ergue no topo da escadaria?"
    ],
    [
      ["The bell tower", "\u949F\u697C", "A torre sineira"],
      ["The stone fa\xE7ade", "\u77F3\u9020\u7ACB\u9762", "A fachada de pedra"],
      ["The roof", "\u5C4B\u9876", "O telhado"]
    ],
    1
  );
  guide(
    "senado",
    [
      "Senado Square was a civic centre for centuries. It connects streets leading to the former municipal building, the Holy House of Mercy and St. Dominic\u2019s Square.",
      "\u8BAE\u4E8B\u4EAD\u524D\u5730\u957F\u671F\u662F\u6FB3\u95E8\u516C\u5171\u751F\u6D3B\u7684\u91CD\u8981\u573A\u6240\uFF0C\u8FDE\u901A\u5E02\u653F\u7F72\u5927\u697C\u3001\u4EC1\u6148\u5802\u548C\u677F\u6A1F\u5802\u524D\u5730\u3002",
      "O Largo do Senado foi durante s\xE9culos um centro c\xEDvico. Liga as ruas que conduzem ao edif\xEDcio municipal, \xE0 Santa Casa da Miseric\xF3rdia e ao Largo de S\xE3o Domingos."
    ],
    [
      "Follow the patterns in the Portuguese-style stone paving. The paving ties together a public square framed by buildings with different functions.",
      "\u6CBF\u8461\u5F0F\u788E\u77F3\u8DEF\u9762\u7684\u56FE\u6848\u89C2\u5BDF\u3002\u94FA\u5730\u5C06\u4E0D\u540C\u7528\u9014\u7684\u5EFA\u7B51\u4E32\u5728\u540C\u4E00\u4E2A\u516C\u5171\u7A7A\u95F4\u4E2D\u3002",
      "Siga os desenhos da cal\xE7ada portuguesa. O pavimento une um espa\xE7o p\xFAblico rodeado de edif\xEDcios com fun\xE7\xF5es diversas."
    ],
    [
      "Follow a wavy line in the pavement with your eyes. Where does it lead?",
      "\u7528\u773C\u775B\u6CBF\u7740\u8DEF\u9762\u7684\u4E00\u6761\u6CE2\u6D6A\u7EBF\u8D70\u3002\u5B83\u901A\u5411\u54EA\u91CC\uFF1F",
      "Siga com os olhos uma linha ondulada no ch\xE3o. Onde acaba?"
    ],
    [
      "Compare the municipal building with the Holy House of Mercy. The two fa\xE7ades face the same public space and recall different civic and charitable roles.",
      "\u6BD4\u8F83\u5E02\u653F\u7F72\u5927\u697C\u548C\u4EC1\u6148\u5802\u3002\u4E24\u5EA7\u7ACB\u9762\u671D\u5411\u540C\u4E00\u4E2A\u516C\u5171\u7A7A\u95F4\uFF0C\u53CD\u6620\u4E0D\u540C\u7684\u5E02\u653F\u53CA\u6148\u5584\u89D2\u8272\u3002",
      "Compare o edif\xEDcio municipal com a Santa Casa da Miseric\xF3rdia. As fachadas d\xE3o para a mesma pra\xE7a e evocam fun\xE7\xF5es c\xEDvicas distintas."
    ],
    [
      "Where can you find the square\u2019s wave pattern?",
      "\u6CE2\u6D6A\u5F62\u56FE\u6848\u5728\u54EA\u91CC\uFF1F",
      "Onde se encontram os desenhos ondulados do largo?"
    ],
    [
      ["On the paving", "\u5728\u5730\u9762\u4E0A", "Na cal\xE7ada"],
      ["On the church roof", "\u5728\u6559\u5802\u5C4B\u9876", "No telhado da igreja"],
      ["On an altar", "\u5728\u796D\u53F0\u4E0A", "Num altar"]
    ],
    0
  );
  guide(
    "dominic",
    [
      "Dominican priests established this church in 1587. It is associated with the Brotherhood of Our Lady of the Rosary.",
      "\u9053\u660E\u4F1A\u4FEE\u58EB\u4E8E 1587 \u5E74\u521B\u7ACB\u73AB\u7470\u5802\uFF0C\u6559\u5802\u4EA6\u4E0E\u73AB\u7470\u5723\u6BCD\u5144\u5F1F\u4F1A\u6709\u5173\u3002",
      "Os dominicanos fundaram esta igreja em 1587. Est\xE1 associada \xE0 Confraria de Nossa Senhora do Ros\xE1rio."
    ],
    [
      "The painted fa\xE7ade and green doors provide a point of comparison with the bare stone front of St. Paul\u2019s.",
      "\u5BF9\u6BD4\u73AB\u7470\u5802\u5E26\u8272\u5F69\u7684\u6B63\u9762\u3001\u7EFF\u8272\u5927\u95E8\u548C\u5927\u4E09\u5DF4\u724C\u574A\u7684\u77F3\u9020\u7ACB\u9762\u3002",
      "A fachada pintada e as portas verdes permitem comparar este edif\xEDcio com a fachada de pedra das Ru\xEDnas de S\xE3o Paulo."
    ],
    [
      "Find a green door and count the levels on the fa\xE7ade from the square.",
      "\u4ECE\u524D\u5730\u627E\u4E00\u6247\u7EFF\u95E8\uFF0C\u518D\u6570\u6570\u6559\u5802\u7ACB\u9762\u6709\u51E0\u5C42\u3002",
      "Procure uma porta verde e conte os pisos da fachada a partir do largo."
    ],
    [
      "The church faces St. Dominic\u2019s Square, which links a place of worship with city streets and commerce.",
      "\u6559\u5802\u671D\u5411\u677F\u6A1F\u5802\u524D\u5730\uFF0C\u8FD9\u4E2A\u7A7A\u95F4\u8FDE\u63A5\u793C\u62DC\u573A\u6240\u3001\u8857\u9053\u548C\u5546\u4E1A\u6D3B\u52A8\u3002",
      "A igreja abre para o Largo de S\xE3o Domingos, onde se encontram o culto, as ruas e o com\xE9rcio."
    ],
    [
      "Which religious order founded this church?",
      "\u54EA\u4E00\u4E2A\u4FEE\u4F1A\u521B\u7ACB\u73AB\u7470\u5802\uFF1F",
      "Que ordem religiosa fundou esta igreja?"

  guide(

  guide(

    [

  guide(
    "lawrence",
    [

      "S\xE3o Louren\xE7o \xE9 uma das igrejas mais antigas de Macau. A localiza\xE7\xE3o a sul da cidade lembra a liga\xE7\xE3o hist\xF3rica \xE0s pessoas que aguardavam o regresso dos marinheiros."

  guide(
    "guia",
    [

  guide(

  guide(

        ) + field("bookingRef", "ref", b.ref, "text", 'maxlength="160"') + field("bookingCancel", "cancel", b.cancel, "text", 'maxlength="240"') + field("bookingLink", "url", b.url, "url", 'maxlength="500"') + '</div><div class="actions end">' + formButton("preview") + "</div></form>"
      );
    }
    if (modal.type === "address") {
      const id = modal.id, p = places[id];
      if (!p) return "";
      return top(
        "address",
        "<p><strong>" + esc(local("zh-Hant", p.n)) + "</strong> \xB7 " + esc(pname(id)) + "</p><p>" + esc(t("zh-Hant", "phrase")) + "</p><p><small>" + p.lat.toFixed(5) + ", " + p.lng.toFixed(5) + '</small></p><div class="actions">' + btn("copy", "copy", id, "secondary") + link("navigation", mapDirections(null, id, "walk"), "button") + "</div>"
      );
    }
    if (modal.type === "ask") {
      const response = modal.response?.map(
        ([type, v]) => type === "key" ? esc(t(modal.responseLang ?? model.lang, v)) : esc(v)
      ).join(" ");
      return top(
        "ask",
        '<p class="muted">' + esc(tr("askHint")) + '</p><form id="ask-form"><label class="field"><span>' + esc(tr("ask")) + '</span><textarea name="ask" maxlength="500" required placeholder="' + esc(tr("askHint")) + '">' + esc(modal.input ?? "") + '</textarea></label><div class="actions end">' + formButton("send") + "</div></form>" + (response ? '<p class="notice good" lang="' + esc(modal.responseLang ?? model.lang) + '">' + response + "</p>" : "")
      );
    }
    if (modal.type === "account") {
      const message = modal.message ? notice(modal.message, modal.error ? "error" : "good") : "";
      const busy = model.accountBusy;
      const tools = model.account ? (model.trip ? btn("saveCloud", "save-cloud", "", "", "", busy) : "") + (model.cloud?.payload ? btn("loadCloud", "load-cloud", "", "secondary", "", busy) + btn("deleteCloud", "delete-cloud", "", "secondary", "", busy) : "") + btn("signOut", "sign-out", "", "secondary", "", busy) : btn("signIn", "sign-in", "", "", "", busy);
      return top("account", notice("accountInfo") + message + '<div class="actions">' + tools + "</div>");
    }
    if (modal.type === "settings") {
      return top(
        "settings",
        notice("privacy") + '<div class="actions">' + btn("export", "export", "", "secondary") + btn("delete", "delete", "", "secondary") + btn("startOver", "new-trip", "", "secondary") + (model.accountEnabled ? btn("account", "account", "", "secondary") : "") + '</div><h3 class="mapnote">' + esc(tr("historyList")) + "</h3>" + model.versions.map(
          (v, i) => '<div class="bookrow"><div class="rowline"><span>' + esc(
            new Date(v.time).toLocaleString(model.lang, {
              timeZone: "Asia/Macau"
            })
          ) + "</span>" + btn("restore", "restore", String(i), "secondary smallbtn") + "</div></div>"
        ).join("")
      );
    }
    if (modal.type === "compare") {
      const p = model.trip.profile;
      const first = current().stops.find((s) => s.placeId !== p.port);
      if (!first) return top("compare", notice("noHotelText"));
      const from = p.port, to = first.placeId;
      return top(
        "compare",
        "<p>" + esc(pname(from)) + " \u2192 " + esc(pname(to)) + "</p>" + ["taxi", "transit", "walk"].map((mode) => {
          const profile = { ...p, walking: "regular", transport: mode };
          const estimate = legFor(
            from,
            to,
            profile,
            mode === "taxi" ? "comfort" : "smart",
            model.routes,
            mode
          );
          return '<div class="bookrow"><strong>' + esc(tr(mode)) + "</strong>" + (mode === "walk" && estimate.mode !== "walk" ? "" : "<small>" + estimate.minutes + " " + esc(tr("minutes")) + " \xB7 " + mop(estimate.cost) + "</small>") + link("navigation", mapDirections(from, to, mode)) + (mode === "walk" && estimate.mode !== "walk" ? "" : btn(
            "chooseTransport",
            "transport",
            mode,
            "secondary smallbtn"
          )) + "</div>";
        }).join("") + notice("routingNote")
      );
    }
    return top(modal.type, "");
  }
  function bindPhoto(img) {
    let triedBackup = false;
    const backup = async () => {
      if (triedBackup || !img.isConnected) return;
      triedBackup = true;
      const photo = await retrievePhoto(img.dataset.placePhoto);
      if (!img.isConnected) return;
      if (photo) {
        img.addEventListener("error", () => {
          img.hidden = true;
        }, { once: true });
        img.src = photo;
      } else {
        img.hidden = true;
      }
    };
    img.addEventListener("error", backup, { once: true });
    if (img.complete && !img.naturalWidth) backup();
  }
  function render() {
    const focus = root.contains(document.activeElement) ? document.activeElement.id : null;
    const sel = focus === "heritage-search" ? document.activeElement.selectionStart : null;
    document.documentElement.lang = model.lang === "zh" ? "zh-Hans" : model.lang;
    disposeMap?.();
    disposeMap = null;
    root.innerHTML = view.header() + view.body() + view.footer() + (model.modal ? dialogContent(model.modal) : "");
    root.querySelectorAll("img[data-place-photo]").forEach(bindPhoto);
    const layer = root.querySelector(".mapcanvas");
    if (layer && current())
      disposeMap = drawMap(
        layer,
        current().stops.map((stop) => ({ ...stop, label: pname(stop.placeId) })),
        {
          active: model.selected,
          onSelect: (id) => focusStop(id, true),
          location: model.location,
          credits: tr("linkOSM"),
          zoomIn: tr("zoomIn"),
          zoomOut: tr("zoomOut"),
          mapLoading: tr("mapBaseLoading"),
          mapUnavailable: tr("mapUnavailable")
        }
      );
    if (focus === "heritage-search") {
      const input = root.querySelector("#heritage-search");
      input?.focus({ preventScroll: true });
      try {
        if (sel != null) input.setSelectionRange(sel, sel);
      } catch {
      }
    }
  }
  async function accountWork(task) {
    if (model.accountBusy) return;
    model.accountBusy = true;
    render();
    try {
      const message = await task();
      if (model.modal?.type === "account") {
        model.modal.message = message ?? null;
        model.modal.error = false;
      }
    } catch {
      if (model.modal?.type === "account") {
        model.modal.message = "cloudError";
        model.modal.error = true;
      }
      try {
        if (model.account) model.cloud = await readCloud();
      } catch {
      }
    } finally {
      model.accountBusy = false;
      render();
    }
  }
  var actions = {
    navigate: (value) => navigate(value),
    "show-examples": () => {
      model.examples = !model.examples;
      render();
    },
    example: (value) => {
      analyse(local(model.lang, samples[value]), { example: true });
    },
    interest: (value) => {
      model.picks = model.picks.includes(value) ? model.picks.filter((v) => v !== value) : [...model.picks, value];
      save();
      render();
    },
    "back-profile": () => navigate("profile"),
    choose: (value) => {
      const chosen = model.options.find((p) => p.strategy === value);
      if (chosen) commit(chosen, { fresh: true });
    },
    day: (value) => {
      model.day = +value;
      model.selected = null;
      model.routeStatus = "idle";
      render();
    },
    guide: (value) => {
      if (!guides[value]) return;
      if (model.page !== "guide") model.guideBack = model.page;
      model.guideId = value;
      model.guideMode = "history";
      navigate("guide");
    },
    "guide-back": () => navigate(model.guideBack ?? "heritage"),
    "guide-mode": (value) => {
      model.guideMode = value;
      render();
    },
    filter: (value) => {
      model.filter = value;
      model.catalogueLimit = 24;
      render();
    },
    "catalogue-view": (value) => {
      model.catalogueView = value === "list" ? "list" : "cards";
      render();
    },
    "catalogue-reset": () => {
      model.category = "";
      model.search = "";
      model.filter = "filterAll";
      render();
    },
    "refresh-plan": () => adapted({ profile: model.trip.profile }, "customReason"),
    "focus-stop": (value) => focusStop(value, false),
    close: () => {
      model.modal = null;
      render();
    },
    complete: (value) => {
      const stop = current()?.stops.find((s) => s.id === value);
      if (!stop) return;
      if (stop.kind === "departure" && stop.status !== "done" && current().stops.some(
        (s) => s.id !== value && s.kind === "booking" && s.confirmed && s.status !== "done"
      )) {
        toast("bookingStill");
        return;
      }
      stop.status = stop.status === "done" ? "planned" : "done";
      save();
      render();
      if (stop.kind === "departure" && stop.status === "done") toast("ready");
    },
    "edit-profile": () => {
      model.editing = true;
      model.recognized = model.trip.profile;
      model.draft = clone(model.trip.profile);
      navigate("profile");
    },
    "add-stop": (value) => {
      if (!model.trip) {
        model.input = l(samples.familyDemo);
        model.picks = ["culture"];
        model.recognized = {
          ...parseProfile(model.input, model.picks),
          requested: [value || "paul"]
        };
        model.draft = defaults(model.recognized);
        model.editing = false;
        navigate("profile");
      } else openModal("add-stop", { id: value });
    },
    "edit-stop": (value) => openModal("edit-stop", { id: value }),
    "move-stop": (value) => {
      const s = current().stops.find((a) => a.id === model.modal.id);
      if (s) adapted(stopConfig(s.placeId, "swap", value));
    },
    "remove-stop": () => {
      const s = current().stops.find((a) => a.id === model.modal.id);
      if (s) adapted(stopConfig(s.placeId, "remove"));
    },
    arrival: (value) => {
      if (current().stops.some((s) => s.kind === "visit" && s.status === "done")) {
        toast("arrivalLocked");
        return;
      }
      adapted({ profile: { ...model.trip.profile, arrivalAction: value } });
    },
    compare: () => openModal("compare"),
    transport: (value) => adapted({ profile: { ...model.trip.profile, transport: value } }),
    "route-fetch": updateRoutes,
    locate: () => {
      if (!navigator.geolocation) {
        toast("geoFail");
        return;
      }
      navigator.geolocation.getCurrentPosition(
        (p) => {
          model.location = { lat: p.coords.latitude, lng: p.coords.longitude };
          model.selected = null;
          render();
        },
        () => toast("geoFail"),
        { timeout: 9e3, maximumAge: 3e4 }
      );
    },
    address: (value) => openModal("address", { id: value }),
    copy: async (value) => {
      const p = places[value];
      try {
        await navigator.clipboard.writeText(
          local("zh-Hant", p.n) + " " + p.lat + ", " + p.lng
        );
        toast("copied");
      } catch {
        toast("copyFail");
      }
    },
    change: () => openModal("change"),
    apply: () => {
      const { next, returnPage } = model.modal;
      commit(next, { page: returnPage });
    },
    booking: (value) => openModal("booking", { id: value }),
    "remove-booking": (value) => {
      const b = model.trip.bookings.find((b2) => b2.id === value);
      if (!b || !window.confirm(tr("removeBookingAsk"))) return;
      if (model.trip.days[b.day]?.stops.some(
        (s) => s.id === b.id && s.status === "done"
      )) {
        toast("bookingStill");
        return;
      }
      const p = b.id === "profile-event" ? { ...model.trip.profile, eventTime: null } : model.trip.profile;
      adapted(
        { profile: p, bookings: model.trip.bookings.filter((x) => x.id !== b.id) },
        "customReason",
        "bookings"
      );
    },
    ask: () => openModal("ask"),
    settings: () => openModal("settings"),
    account: () => openModal("account"),
    "sign-in": () => accountWork(async () => {
      save();
      await accountSignIn();
    }),
    "sign-out": () => accountWork(async () => {
      await accountSignOut();
      model.account = null;
      model.cloud = null;
    }),
    "save-cloud": () => accountWork(async () => {
      if (!model.trip || !model.account) return;
      const payload = { trip: model.trip, stamps: model.stamps, quizCompletions: model.quizCompletions, serviceState: model.serviceState };
      model.cloud = await saveCloud({
        payload,
        expectedVersion: model.cloud?.version ?? null,
        version: crypto.randomUUID()
      });
      return "cloudSaved";
    }),
    "load-cloud": () => accountWork(async () => {
      model.cloud = await readCloud();
      if (!model.cloud?.payload?.trip) return "noTrip";
      if (model.trip && !window.confirm(tr("cloudReplace"))) return;
      model.quizCompletions = restoreCompletions({
        ...restoreCompletions(model.cloud.payload.quizCompletions),
        ...model.quizCompletions
      });
      model.stamps = earnedStamps(model.quizCompletions);
      if (model.cloud.payload.serviceState) model.serviceState = clone(model.cloud.payload.serviceState);
      commit(clone(model.cloud.payload.trip));
    }),
    "delete-cloud": () => {
      if (!model.cloud?.version || !window.confirm(tr("cloudDeleteAsk"))) return;
      accountWork(async () => {
        model.cloud = await removeCloud({ expectedVersion: model.cloud.version, version: crypto.randomUUID() });
        return "cloudDeleted";
      });
    },
    restore: (value) => {
      const entry = model.versions[+value];
      if (entry) commit(clone(entry.trip));
    },
    export: () => {
      const blob = new Blob(
        [
          JSON.stringify(
            { trip: model.trip, stamps: model.stamps, quizCompletions: model.quizCompletions, language: model.lang, serviceState: model.serviceState },
            null,
            2
          )
        ],
        { type: "application/json" }
      );
      const url = URL.createObjectURL(blob), a = document.createElement("a");
      a.href = url;
      a.download = "macau-mate-itinerary.json";
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1e3);
    },
    delete: () => {
      if (!window.confirm(tr("deleteAsk"))) return;
      model.trip = null;
      model.versions = [];
      model.draft = null;
      model.input = "";
      model.routes = {};
      model.picks = [];
      model.recognized = {};
      model.serviceState = { type: "hotel", drafts: {}, requests: [] };
      save();
      navigate("home");
    },
    "new-trip": () => {
      if (!window.confirm(tr("startOverAsk"))) return;
      model.input = "";
      model.draft = null;
      model.editing = false;
      model.picks = [];
      save();
      navigate("home");
    }
  };
  root.addEventListener("click", (e) => {
    const b = e.target.closest("[data-action]");
    if (b) {
      (serviceUI.actions[b.dataset.action] ?? actions[b.dataset.action])?.(b.dataset.value ?? "");
      return;
    }
    if (e.target.matches("[data-overlay]")) actions.close();
  });
  root.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && model.modal) actions.close();
  });
  root.addEventListener("change", (e) => {
    if (e.target.matches('#quiz-form input[name="answer"]')) {
      model.quizSelections[model.guideId] = e.target.value;
      delete model.quizFeedback[model.guideId];
    }
    serviceUI.persistDraft(e.target.closest("form"));
    if (e.target.closest("#service-request-form") && e.target.name === "provider") render();
    if (e.target.id === "catalogue-category") {
      model.category = e.target.value;
      model.catalogueLimit = 24;
      render();
    }
    if (e.target.id === "language" && languages[e.target.value]) {
      model.lang = e.target.value;
      if (model.page === "profile" && root.querySelector("#profile-form"))
        model.draft = readProfile(root.querySelector("#profile-form"));
      save();
      render();
    }
  });
  root.addEventListener("input", (e) => {
    serviceUI.persistDraft(e.target.closest("form"));
    if (e.target.id === "trip-input") {
      model.input = e.target.value;
      save();
    }
    if (e.target.id === "heritage-search") {
      model.search = e.target.value;
      model.catalogueLimit = 24;
      clearTimeout(searchTimer);
      searchTimer = setTimeout(render, 130);
    }
  });
  root.addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = e.target, v = formValues(f);
    if (await serviceUI.submit(f, v)) return;
    if (f.id === "start-form") {
      await analyse(v.input || "");
      return;
    }
    if (f.id === "profile-form") {
      const p = readProfile(f);
      if (!validTimes(p)) {
        toast("badTime");
        return;
      }
      model.draft = p;
      save();
      if (model.editing) {
        const booked = model.trip.bookings.filter((b) => b.id !== "profile-event");
        if (booked.some((b) => b.day >= p.days) || model.trip.days.slice(p.days).some((d) => d.stops.some((s) => s.status === "done"))) {
          toast("conflict");
          return;
        }
        const prior = model.trip.bookings.find((b) => b.id === "profile-event");
        if (prior && p.eventTime != null)
          booked.push({
            ...prior,
            start: p.eventTime,
            placeId: p.eventPlace,
            duration: p.eventDuration,
            name: p.eventName
          });
        adapted({ profile: p, bookings: booked });
      } else {
        model.options = planOptions(p, { routes: model.routes });
        model.loadingPhase = "planning";
        openModal("loading");
        try {
          const planned = await serverPost("plan", { profile: p, routes: model.routes });
          if (planned.options?.length === 3) model.options = planned.options;
          if (planned.routes) model.routes = Object.fromEntries(Object.entries({ ...model.routes, ...planned.routes }).slice(-3e3));
          model.planningRouteStatus = planned.routingStatus ?? "estimated";
        } catch {
          model.planningRouteStatus = "estimated";
        }
        save();
        navigate("options");
      }
    }
    if (f.id === "quiz-form") {
      const id = f.dataset.placeId;
      if (!id || id !== model.guideId) return;
      const result = submitQuiz(model.quizCompletions, id, v.answer);
      model.quizFeedback[id] = result.ok ? "stampEarned" : result.reason;
      if (typeof v.answer === "string") model.quizSelections[id] = v.answer;
      if (result.ok) {
        model.quizCompletions = result.records;
        save();
      }
      render();
      toast(result.ok ? "stampEarned" : result.reason);
      return;
    }
    if (f.id === "change-form") {
      const input = (v.change ?? "").trim();
      let change = parseChange(input, model.trip, model.day, model.selected);
      if (!change.recognized) {
        openModal("loading");
        try {
          const remote = await serverPost("change", { text: input });
          if (remote.command)
            change = parseChange(
              remote.command,
              model.trip,
              model.day,
              model.selected
            );
        } catch {
        }
      }
      if (!change.recognized) {
        openModal("change", { text: input });
        toast("noChange");
        return;
      }
      adapted(change, change.reason);
    }
    if (f.id === "stop-form") {
      if (model.trip.days.some((day, i) => i !== +v.day && day.stops.some((stop) => ["visit", "meal"].includes(stop.kind) && canonicalPlace(stop.placeId) === canonicalPlace(v.placeId)))) {
        toast("duplicateVisitBlocked");
        return;
      }
      model.day = +v.day;
      const values = stopConfig(v.placeId, "add");
      values.durations = { [model.day + "|" + v.placeId]: +v.duration };
      const trip = {
        ...model.trip,
        config: {
          ...model.trip.config,
          skips: model.trip.config.skips.filter((id) => id !== v.placeId)
        }
      };
      const next = replan(trip, { ...localChange(), ...values }, model.routes);
      if (!next.days[model.day].stops.some(
        (s) => s.placeId === v.placeId && s.kind === "visit"
      )) {
        toast("noFits");
        return;
      }
      propose(next, "customReason");
    }
    if (f.id === "edit-stop-form") {
      const stop = current().stops.find((s) => s.id === model.modal.id);
      if (stop) adapted(stopConfig(stop.placeId, "duration", +v.duration));
    }
    if (f.id === "booking-form") {
      const old = model.trip.bookings.find((b2) => b2.id === model.modal.id);
      const start = fromTime(v.start), duration = +v.duration;
      if (start == null || duration < 5 || start + duration > 1440) {
        toast("badTime");
        return;
      }
      const b = {
        id: old?.id ?? crypto.randomUUID(),
        name: v.name.trim(),
        type: v.type,
        category: v.type === "food" ? "foodCost" : v.type === "event" ? "cultureCost" : v.type,
        placeId: v.placeId,
        day: +v.day,
        start,
        duration,
        cost: v.cost === "" ? null : +v.cost,
        ref: v.ref.trim(),
        cancel: v.cancel.trim(),
        url: safeUrl(v.url),
        confirmed: v.status === "confirmed",
        simulation: old?.simulation ?? false
      };
      if (old && model.trip.days[old.day]?.stops.some(
        (s) => s.id === old.id && s.status === "done"
      )) {
        toast("bookingStill");
        return;
      }
      const booked = model.trip.bookings.filter((item) => item.id !== b.id).concat(b);
      const p = b.id === "profile-event" ? {
        ...model.trip.profile,
        eventTime: b.start,
        eventPlace: b.placeId,
        eventDuration: b.duration,
        eventName: b.name
      } : model.trip.profile;
      adapted({ profile: p, bookings: booked }, "customReason", "bookings");
    }
    if (f.id === "ask-form") {
      const input = (v.ask ?? "").trim(), lang = parseProfile(input).language;
      const stop = current().stops.find((s) => s.status !== "done"), place2 = heritageIds.find(
        (id) => places[id].n.some((n) => input.toLowerCase().includes(n.toLowerCase()))
      );
      const key = (value2) => ["key", value2], value = (v2) => ["text", v2];
      let response = [key("askHint")];
      if (/bag|luggage|行李|mala/i.test(input))
        response = [
          key("firstAction"),
          key(model.trip.first),
          key("storageNotice")
        ];
      else if (/budget|预算|預算|钱|錢|orçamento|custo/i.test(input))
        response = [
          key("remaining"),
          value(mop(model.trip.budget.remaining)),
          key("budgetNote")
        ];
      else if (place2)
        response = [
          value(local(lang, places[place2].n)),
          value(local(lang, guides[place2].levels.history))
        ];
      else if (/next|próxim|下一|where|onde|现在|現在/i.test(input) && stop)
        response = [
          key("nextStop"),
          value(local(lang, places[stop.placeId].n)),
          value(toTime(stop.start))
        ];
      openModal("ask", { input, response, responseLang: lang });
    }
  });
  render();
  if (accountEnabled) initializeAccount();
})();
